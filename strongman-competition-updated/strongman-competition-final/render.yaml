services:
  - type: web
    name: strongmancast
    runtime: docker
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: strongmancast-db
          property: connectionString
      - key: ORGANIZER_USERNAME
        sync: false
      - key: ORGANIZER_PASSWORD
        sync: false

databases:
  - name: strongmancast-db
    plan: free
    databaseName: strongmancast
    user: strongmancast
