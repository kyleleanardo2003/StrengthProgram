<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Athlete</title>
    <style>
        body {
            background-color: #1e1e1e;
            color: white;
            font-family: sans-serif;
            padding: 20px;
        }
        label, input, select, button {
            display: block;
            margin: 10px 0;
            font-size: 1.1em;
        }
        input, select {
            padding: 5px;
            width: 300px;
        }
        button {
            padding: 8px 16px;
            background-color: #007acc;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #005f99;
        }
    </style>
</head>
<body>
    <h1>Add Athlete</h1>
    <form th:action="@{/athletes}" th:object="${athlete}" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" th:field="*{name}" required />

        <label for="bodyweight">Body Weight:</label>
        <input type="number" step="0.1" id="bodyweight" th:field="*{bodyweight}" required />

        <label for="division">Division:</label>
        <select id="division" th:field="*{division}" required>
            <option value="">Select Division</option>
            <option th:each="d : ${T(com.example.strongman916.strongman_competition.model.Division).values()}"
                    th:value="${d}" th:text="${d.label}">Division</option>
        </select>

        <button type="submit">Save Athlete</button>
    </form>
</body>
</html>
