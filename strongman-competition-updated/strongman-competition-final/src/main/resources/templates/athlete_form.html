<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Athlete</title>
    <style>
        body {
            background-color: #1e1e1e;
            color: white;
            font-family: sans-serif;
            padding: 20px;
        }
        label, input, select, button {
            display: block;
            margin: 10px 0;
            font-size: 1.1em;
        }
        input, select {
            padding: 5px;
            width: 300px;
        }
        button {
            padding: 8px 16px;
            background-color: #007acc;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #005f99;
        }
        a {
            color: #66b7ff;
            margin-right: 16px;
        }
    </style>
    <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body>
    <div th:replace="~{fragments/nav :: appNav}"></div>
    <h1 class="page-title" th:text="${formTitle}">Add Athlete</h1>

    <form th:action="${formAction}" th:object="${athlete}" method="post">
        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <input type="hidden" name="competitionId" th:value="${competitionId}" />

        <label for="name">Name:</label>
        <input type="text" id="name" th:field="*{name}" required />

        <label for="membership">Membership:</label>
        <input type="text" id="membership" th:field="*{membership}" />

        <label for="gender">Class Group:</label>
        <select id="gender" th:field="*{gender}">
            <option value="">Choose group</option>
            <option value="Men">Men</option>
            <option value="Women">Women</option>
            <option value="Adaptive">Adaptive</option>
        </select>

        <label for="bodyweight">Body Weight (kg):</label>
        <input type="number" step="0.1" id="bodyweight" th:field="*{bodyweight}" required />

        <label for="division">Weight Class Override (optional):</label>
        <input type="text" id="division" th:field="*{division}" placeholder="Leave blank to auto-calculate, or enter Adaptive/Masters/custom class" />

        <label for="eventGroup">Event Group (optional):</label>
        <input type="text" id="eventGroup" th:field="*{eventGroup}" placeholder="Optional: Group A, Novice Women, Lane 1, etc." />

        <button type="submit">Save Athlete</button>
    </form>
</body>
</html>
