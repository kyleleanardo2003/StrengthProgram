<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Athlete</title>
    <style>
        body {
            background-color: #1e1e1e;
            color: white;
            font-family: sans-serif;
            padding: 20px;
        }
        label, input, select, button {
            display: block;
            margin: 10px 0;
            font-size: 1.1em;
        }
        input, select {
            padding: 5px;
            width: 300px;
        }
        button {
            padding: 8px 16px;
            background-color: #007acc;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #005f99;
        }
        a {
            color: #66b7ff;
            margin-right: 16px;
        }
    </style>
</head>
<body>
    <h1 th:text="${formTitle}">Add Athlete</h1>
    <nav>
        <a th:href="@{/}">Public Results</a>
        <a th:href="@{/organizer}">Organizer Results</a>
        <a th:href="@{/events}">Setup Events</a>
        <a th:href="@{/athletes}">Athletes</a>
    </nav>

    <form th:action="${formAction}" th:object="${athlete}" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" th:field="*{name}" required />

        <label for="membership">Membership:</label>
        <input type="text" id="membership" th:field="*{membership}" />

        <label for="bodyweight">Body Weight (kg):</label>
        <input type="number" step="0.1" id="bodyweight" th:field="*{bodyweight}" required />

        <label for="division">Division:</label>
        <input type="text" id="division" th:field="*{division}" placeholder="Women u73, Men Open, Masters, etc." required />

        <button type="submit">Save Athlete</button>
    </form>
</body>
</html>
