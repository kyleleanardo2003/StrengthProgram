<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Strongman Competition Results</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
            padding: 20px;
        }
        h2 {
            margin-top: 40px;
            border-bottom: 2px solid #fff;
            padding-bottom: 5px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 40px;
        }
        th, td {
            border: 1px solid #fff;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #111;
        }
        a {
            color: #66b7ff;
        }
        .actions {
            margin-bottom: 24px;
        }
        .actions a {
            margin-right: 16px;
        }
        .event-button-row {
            align-items: center;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 18px 0 24px;
        }
        .event-button-row a {
            margin-right: 0;
        }
        .delete-all-form {
            display: inline;
            margin: 0;
        }
        .delete-all-button {
            background-color: #a83232;
            border: 0;
            border-radius: 3px;
            color: #fff;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            padding: 7px 9px;
        }
        .delete-all-button:hover {
            background-color: #7f2424;
        }
        .highlight-legend {
            align-items: center;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 4px 0 20px;
        }
        .highlight-key {
            align-items: center;
            display: inline-flex;
            font-size: 0.9rem;
            font-weight: 700;
            gap: 6px;
        }
        .highlight-swatch {
            border: 1px solid #777;
            display: inline-block;
            height: 14px;
            width: 28px;
        }
        .highlight-swatch.is-active {
            background: #153a24;
            border-color: #55d187;
        }
        .highlight-swatch.is-next {
            background: #3a3215;
            border-color: #d1b255;
        }
        .highlight-swatch.is-next-to-hole {
            background: #223347;
            border-color: #69b7ff;
        }
        .competitor-name {
            color: #fff;
            font-weight: 900;
            text-decoration: underline;
            text-underline-offset: 3px;
        }
        tr.is-active {
            background: #153a24;
            outline: 2px solid #55d187;
        }
        tr.is-next {
            background: #3a3215;
            outline: 2px solid #d1b255;
        }
        tr.is-next-to-hole {
            background: #223347;
            outline: 2px solid #69b7ff;
        }
    </style>
    <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: appNav}"></div>
<h1 class="page-title" th:text="${currentCompetition != null ? currentCompetition.name : 'Strongman Competition Results'}">Strongman Competition Results</h1>
<p th:if="${currentCompetition != null}">
    <span th:text="${currentCompetition.competitionDate}">Date</span>
    <span th:if="${currentCompetition.location != null && !currentCompetition.location.isBlank()}"
          th:text="${' - ' + currentCompetition.location}">Location</span>
</p>

<p th:if="${error}" th:text="${error}">Error</p>
<p th:if="${divisions == null || divisions.isEmpty()}">No athletes have been added yet.</p>

<div class="event-button-row"
     th:if="${configuredEvents != null && !configuredEvents.isEmpty()}">
    <a class="hub-button"
       th:each="event : ${configuredEvents}"
       th:href="@{/events/{id}/live(id=${event.id})}"
       th:text="${event.eventName}">Event</a>
    <form class="delete-all-form" th:if="${canEditCompetitions && currentCompetition != null}"
          th:action="@{/data/delete-all}" method="post"
          onsubmit="return confirm('Delete all athletes, events, scores, and settings for this competition?');">
        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <input type="hidden" name="competitionId" th:value="${competitionId}" />
        <button class="delete-all-button" type="submit">Delete All Info</button>
    </form>
</div>

<div class="highlight-legend" th:if="${divisions != null && !divisions.isEmpty()}">
    <span class="highlight-key"><span class="highlight-swatch is-active"></span>On stage</span>
    <span class="highlight-key"><span class="highlight-swatch is-next"></span>In the hole</span>
    <span class="highlight-key"><span class="highlight-swatch is-next-to-hole"></span>Next in the hole</span>
</div>

<div th:each="division : ${divisions}">
    <h2 th:text="${division.key}">Division Name</h2>
    <table>
        <thead>
        <tr>
            <th rowspan="2">Name</th>
            <th rowspan="2">Body Weight (kg)</th>
            <th rowspan="2">Place</th>
            <th th:each="event : ${configuredEvents}" colspan="2" th:text="${event.eventName}">Event</th>
            <th rowspan="2">Total Points</th>
        </tr>
        <tr>
            <th:block th:each="event : ${configuredEvents}">
                <th>Result</th>
                <th>Points</th>
            </th:block>
        </tr>
        </thead>
        <tbody>
        <tr th:each="competitor : ${division.value}"
            th:classappend="${competitor.onStage} ? 'is-active' : (${competitor.nextInHole} ? 'is-next' : (${competitor.nextToHole} ? 'is-next-to-hole' : ''))">
            <td class="competitor-name" th:text="${competitor.name}">Name</td>
            <td th:text="${competitor.bodyWeight}">0.0</td>
            <td th:text="${competitor.place}">1</td>
            <th:block th:each="event : ${configuredEvents}">
                <td th:text="${competitor.displayResults[event.eventName]}">result</td>
                <td th:text="${competitor.eventPoints[event.eventName]}">points</td>
            </th:block>
            <td th:text="${competitor.totalPoints}">0.0</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
