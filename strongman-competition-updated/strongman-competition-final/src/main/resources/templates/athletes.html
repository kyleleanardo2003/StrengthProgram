<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Athletes</title>
    <style>
        body {
            background-color: #1e1e1e;
            color: white;
            font-family: sans-serif;
            padding: 20px;
        }
        a {
            color: #66b7ff;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #555;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #2d2d2d;
        }
        button {
            padding: 8px 16px;
            background-color: #a83232;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #7f2424;
        }
        .danger-zone {
            border: 1px solid #8a2d2d;
            margin: 24px 0;
            padding: 16px;
        }
    </style>
    <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body>
    <div th:replace="~{fragments/nav :: appNav}"></div>
    <h1 class="page-title" th:text="${currentCompetition != null ? 'Athletes - ' + currentCompetition.name : 'Athletes'}">Athletes</h1>

    <p class="page-actions">
        <a class="hub-button" th:href="@{/athletes/new(competitionId=${competitionId})}">Add Athlete</a>
        <a class="hub-button" th:href="@{/organizer(competitionId=${competitionId})}">Organizer Results</a>
    </p>

    <section class="danger-zone">
        <h2>Athlete Controls</h2>
        <form th:action="@{/data/delete-competitors}" method="post">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <input type="hidden" name="competitionId" th:value="${competitionId}" />
            <button type="submit">Delete All Athletes</button>
        </form>
    </section>

    <table>
        <thead>
        <tr>
            <th>Name</th>
            <th>Membership</th>
            <th>Class Group</th>
            <th>Body Weight (kg)</th>
            <th>Class Override</th>
            <th>Event Group</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="athlete : ${athletes}">
            <td th:text="${athlete.name}">Name</td>
            <td th:text="${athlete.membership}">Membership</td>
            <td th:text="${athlete.gender}">Class Group</td>
            <td th:text="${athlete.bodyweight}">0.0</td>
            <td th:text="${athlete.division}">Division</td>
            <td th:text="${athlete.eventGroup}">Event Group</td>
            <td><a th:href="@{/athletes/{id}/edit(id=${athlete.id})}">Edit</a></td>
        </tr>
        </tbody>
    </table>
</body>
</html>
