<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Setup Events</title>
    <style>
        body {
            background-color: #1e1e1e;
            color: white;
            font-family: sans-serif;
            padding: 20px;
        }
        a {
            color: #66b7ff;
            margin-right: 16px;
        }
        label, input, select, textarea, button {
            font-size: 1.05em;
        }
        input, select, textarea {
            box-sizing: border-box;
            padding: 6px;
            width: 100%;
        }
        textarea {
            min-height: 80px;
        }
        button {
            padding: 8px 16px;
            background-color: #007acc;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #005f99;
        }
        .danger-zone {
            border: 1px solid #8a2d2d;
            margin: 24px 0;
            padding: 16px;
        }
        .danger-zone form {
            display: inline-block;
            margin: 6px 10px 6px 0;
        }
        .danger-zone button,
        .delete-button {
            background-color: #a83232;
        }
        .danger-zone button:hover,
        .delete-button:hover {
            background-color: #7f2424;
        }
        .autofill-button {
            background-color: #267a3d;
        }
        .autofill-button:hover {
            background-color: #1d5f30;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
        }
        th, td {
            border: 1px solid #555;
            padding: 8px;
            text-align: left;
            vertical-align: top;
        }
        th {
            background-color: #2d2d2d;
        }
        .edit-grid {
            display: grid;
            gap: 10px;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            align-items: end;
        }
        .edit-grid .notes-field {
            grid-column: span 2;
        }
        .event-form-grid {
            display: grid;
            gap: 16px;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            align-items: end;
            max-width: 1200px;
        }
        .event-form-grid .wide {
            grid-column: 1 / -1;
        }
        .field label,
        .edit-grid label {
            display: block;
            font-size: 0.8em;
            margin-bottom: 4px;
        }
        .edit-grid input,
        .edit-grid select,
        .edit-grid textarea {
            width: 100%;
        }
        .checkbox-row {
            display: flex;
            gap: 8px;
            align-items: center;
            margin: 0;
        }
        .checkbox-row input {
            width: auto;
        }
    </style>
    <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: appNav}"></div>
<h1 class="page-title" th:text="${currentCompetition != null ? 'Setup Events - ' + currentCompetition.name : 'Setup Events'}">Setup Events</h1>

<section class="danger-zone">
    <h2>Event Controls</h2>
    <form th:action="@{/data/autofill-base-model}" method="post">
        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <input type="hidden" name="competitionId" th:value="${competitionId}" />
        <button class="autofill-button" type="submit">Autofill Base Model: Events, Athletes, Scores</button>
    </form>
    <form th:action="@{/data/delete-events}" method="post">
        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <input type="hidden" name="competitionId" th:value="${competitionId}" />
        <button type="submit">Delete All Events</button>
    </form>
</section>

<h2>Scoring Settings</h2>
<form th:action="@{/settings/tiebreaker}" method="post">
    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
    <input type="hidden" name="competitionId" th:value="${competitionId}" />
    <label for="overallTiebreaker">Overall Tie Breaker:</label>
    <select id="overallTiebreaker" name="overallTiebreaker">
        <option value="EVENT_PLACINGS" th:selected="${settings.overallTiebreaker == 'EVENT_PLACINGS'}">
            Better placement across all events
        </option>
        <option value="LAST_EVENT" th:selected="${settings.overallTiebreaker == 'LAST_EVENT'}">
            Better placement in last event
        </option>
    </select>
    <button type="submit">Save Scoring Settings</button>
</form>

<h2>Add Event</h2>
<form class="event-form-grid" th:action="@{/events}" th:object="${event}" method="post">
    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
    <input type="hidden" name="competitionId" th:value="${competitionId}" />
    <div class="field">
        <label for="sortOrder">Order</label>
        <input type="number" id="sortOrder" th:field="*{sortOrder}" required />
    </div>

    <div class="field">
        <label for="eventName">Event Name</label>
        <input type="text" id="eventName" th:field="*{eventName}" required />
    </div>

    <div class="field">
        <label for="resultLabel">Result Label</label>
        <input type="text" id="resultLabel" th:field="*{resultLabel}" placeholder="Weight, reps, distance, height, etc." required />
    </div>

    <div class="field">
        <label for="defaultUnit">Default Unit</label>
        <select id="defaultUnit" th:field="*{defaultUnit}">
            <option value="">No unit</option>
            <option value="kg">kg</option>
            <option value="lb">lb</option>
            <option value="reps">reps</option>
            <option value="m">m</option>
            <option value="ft">ft</option>
            <option value="sec">sec</option>
        </select>
    </div>

    <div class="field">
        <label for="completionTarget">Completion Target</label>
        <input type="number" step="0.01" id="completionTarget" th:field="*{completionTarget}" placeholder="Example: 6 flips" />
    </div>

    <label class="checkbox-row">
        <input type="checkbox" th:field="*{higherIsBetter}" />
        Higher result wins
    </label>

    <label class="checkbox-row">
        <input type="checkbox" th:field="*{usesTime}" />
        Uses time
    </label>

    <label class="checkbox-row">
        <input type="checkbox" th:field="*{timeIsTieBreaker}" />
        Time breaks ties
    </label>

    <label class="checkbox-row">
        <input type="checkbox" th:field="*{requiresCompletionForTimeRanking}" />
        Must complete target before time ranks
    </label>

    <div class="field wide">
        <label for="extraFields">Special Fields / Notes</label>
        <textarea id="extraFields" th:field="*{extraFields}" placeholder="Example: implement weight, frame length, distance, rep cap, split times, stone series weights"></textarea>
    </div>

    <button type="submit">Add Event</button>
</form>

<h2>Edit Events</h2>
<table>
    <thead>
    <tr>
        <th>Event Setup</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="configuredEvent : ${events}">
        <td>
            <form class="edit-grid" th:action="@{/events/{id}(id=${configuredEvent.id})}" method="post">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <input type="hidden" name="competitionId" th:value="${competitionId}" />
                <div>
                    <label>Order</label>
                    <input type="number" name="sortOrder" th:value="${configuredEvent.sortOrder}" required />
                </div>
                <div>
                    <label>Name</label>
                    <input type="text" name="eventName" th:value="${configuredEvent.eventName}" required />
                </div>
                <div>
                    <label>Result Label</label>
                    <input type="text" name="resultLabel" th:value="${configuredEvent.resultLabel}" required />
                </div>
                <div>
                    <label>Unit</label>
                    <select name="defaultUnit">
                        <option value="" th:selected="${configuredEvent.defaultUnit == null || configuredEvent.defaultUnit.isBlank()}">None</option>
                        <option value="kg" th:selected="${configuredEvent.defaultUnit == 'kg'}">kg</option>
                        <option value="lb" th:selected="${configuredEvent.defaultUnit == 'lb'}">lb</option>
                        <option value="reps" th:selected="${configuredEvent.defaultUnit == 'reps'}">reps</option>
                        <option value="m" th:selected="${configuredEvent.defaultUnit == 'm'}">m</option>
                        <option value="ft" th:selected="${configuredEvent.defaultUnit == 'ft'}">ft</option>
                        <option value="sec" th:selected="${configuredEvent.defaultUnit == 'sec'}">sec</option>
                    </select>
                </div>
                <label class="checkbox-row">
                    <input type="checkbox" name="higherIsBetter" value="true" th:checked="${configuredEvent.higherIsBetter}" />
                    Higher wins
                </label>
                <label class="checkbox-row">
                    <input type="checkbox" name="usesTime" value="true" th:checked="${configuredEvent.usesTime}" />
                    Uses time
                </label>
                <label class="checkbox-row">
                    <input type="checkbox" name="timeIsTieBreaker" value="true" th:checked="${configuredEvent.timeIsTieBreaker}" />
                    Time tie-break
                </label>
                <label class="checkbox-row">
                    <input type="checkbox" name="requiresCompletionForTimeRanking" value="true" th:checked="${configuredEvent.requiresCompletionForTimeRanking}" />
                    Complete target first
                </label>
                <div>
                    <label>Completion Target</label>
                    <input type="number" step="0.01" name="completionTarget" th:value="${configuredEvent.completionTarget}" />
                </div>
                <div class="notes-field">
                    <label>Special Fields / Notes</label>
                    <textarea name="extraFields" th:text="${configuredEvent.extraFields}"></textarea>
                </div>
                <button type="submit">Save</button>
            </form>
            <form th:action="@{/events/{id}/delete(id=${configuredEvent.id})}" method="post">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <input type="hidden" name="competitionId" th:value="${competitionId}" />
                <button class="delete-button" type="submit">Delete Event</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
