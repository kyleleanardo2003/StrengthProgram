<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Enter Scores</title>
    <style>
        body {
            background-color: #1e1e1e;
            color: white;
            font-family: sans-serif;
            padding: 20px;
        }
        a {
            color: #66b7ff;
        }
        label, input, select, button {
            display: block;
            margin: 10px 0;
            font-size: 1.1em;
        }
        input, select {
            padding: 5px;
            width: 320px;
        }
        button {
            padding: 8px 16px;
            background-color: #007acc;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #005f99;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
        }
        th, td {
            border: 1px solid #555;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #2d2d2d;
        }
    </style>
</head>
<body>
    <h1>Enter Scores</h1>
    <a th:href="@{/athletes/new}">Add Athlete</a>
    <a th:href="@{/athletes}" style="margin-left: 16px;">Athletes</a>
    <a th:href="@{/}" style="margin-left: 16px;">Results</a>

    <form th:action="@{/scores}" method="post">
        <label for="athleteId">Athlete:</label>
        <select id="athleteId" name="athleteId" required>
            <option value="">Select Athlete</option>
            <option th:each="athlete : ${athletes}"
                    th:value="${athlete.id}"
                    th:text="${athlete.name + ' - ' + athlete.division.label}">Athlete</option>
        </select>

        <label for="eventName">Event:</label>
        <select id="eventName" name="eventName" required>
            <option value="">Select Event</option>
            <option th:each="event : ${events}" th:value="${event}" th:text="${event}">Event</option>
        </select>

        <label for="result">Result:</label>
        <input type="number" step="0.01" id="result" name="result" placeholder="Weight, reps, distance, etc." />

        <label for="time">Time:</label>
        <input type="number" step="0.01" id="time" name="time" placeholder="Seconds, for timed events" />

        <button type="submit">Save Score</button>
    </form>

    <table>
        <thead>
        <tr>
            <th>Athlete</th>
            <th>Event</th>
            <th>Result</th>
            <th>Time</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="result : ${results}">
            <td th:text="${result.athlete.name}">Athlete</td>
            <td th:text="${result.eventName}">Event</td>
            <td th:text="${result.result}">0.0</td>
            <td th:text="${result.time}">0.0</td>
        </tr>
        </tbody>
    </table>
</body>
</html>
