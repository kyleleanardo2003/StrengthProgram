<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="10">
    <title th:text="${'Event ' + event.sortOrder + ': ' + event.eventName}">Live Event</title>
    <style>
        .live-event-page {
            margin: 0 auto;
            max-width: 900px;
        }
        .event-meta {
            color: #c8d2dc;
            font-weight: 700;
            margin: 8px 0 24px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            border: 1px solid #777;
            padding: 10px;
            text-align: left;
        }
        th {
            text-align: center;
        }
        tr.is-active {
            background: #153a24;
            outline: 3px solid #55d187;
        }
        tr.is-next {
            background: #3a3215;
            outline: 3px solid #d1b255;
        }
        tr.is-next-to-hole {
            background: #223347;
            outline: 3px solid #69b7ff;
        }
        .status-pill {
            color: #78d381;
            font-weight: 800;
            text-transform: uppercase;
        }
        .status-pill.is-next {
            color: #f0cf6a;
        }
        .status-pill.is-next-to-hole {
            color: #69b7ff;
        }
        .group-heading {
            margin: 30px 0 10px;
        }
    </style>
    <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: appNav}"></div>
<main class="live-event-page">
    <h1 class="page-title" th:text="${'Event ' + event.sortOrder + ': ' + event.eventName}">Event</h1>
    <p class="event-meta" th:if="${currentCompetition != null}" th:text="${currentCompetition.name}">Competition</p>
    <p class="page-actions">
        <a class="hub-button" th:href="@{/results(competitionId=${competitionId})}">Main Spreadsheet</a>
    </p>

    <p th:if="${rowsByGroup == null || rowsByGroup.isEmpty()}">No athletes have been added yet.</p>
    <section th:each="groupRows : ${rowsByGroup}">
    <h2 class="group-heading" th:text="${groupRows.key}">Group</h2>
    <table>
        <thead>
        <tr>
            <th>Name</th>
            <th>Event Place</th>
            <th>Event Points</th>
            <th>Score</th>
            <th>Overall Place</th>
            <th>Status</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="row : ${groupRows.value}"
            th:classappend="${row.onStage} ? 'is-active' : (${row.nextInHole} ? 'is-next' : (${row.nextToHole} ? 'is-next-to-hole' : ''))">
            <td th:text="${row.athlete.name}">Name</td>
            <td th:text="${row.divisionPlace}">Place</td>
            <td th:text="${row.eventPoints}">Points</td>
            <td th:text="${row.scoreDisplay}">Score</td>
            <td th:text="${row.overallPlace}">Overall</td>
            <td>
                <span class="status-pill"
                      th:if="${row.onStage}">On Stage</span>
                <span class="status-pill is-next"
                      th:if="${row.nextInHole}">In The Hole</span>
                <span class="status-pill is-next-to-hole"
                      th:if="${row.nextToHole}">Next In The Hole</span>
            </td>
        </tr>
        </tbody>
    </table>
    </section>
</main>
</body>
</html>
